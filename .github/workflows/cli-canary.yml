name: 🐤 CLI Canary Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build canary from (default: current branch)'
        required: false
        type: string
        default: ''

# contents: write so the release job can create the GitHub Release + upload the
# compiled binaries. id-token: write for npm provenance.
permissions:
  contents: write
  id-token: write

jobs:
  # 1) Publish the canary packages to npm (unchanged behavior) + expose the
  #    canary version and the exact commit so the release job can tag it.
  publish:
    name: 🐤 Publish canary to npm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.12.0 ]
    outputs:
      version: ${{ steps.version.outputs.CANARY_VERSION }}
      sha: ${{ steps.version.outputs.SHA }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install the packages
        run: pnpm i

      - name: 🏗 Build packages
        run: pnpm run build

      - name: 🔐 Setup npm auth
        run: |
          echo "registry=https://registry.npmjs.org" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🕵️ Determine canary version
        id: version
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=${SHA::7}
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          CANARY_VERSION="canary-${SHORT_SHA}"
          echo "CANARY_VERSION=${CANARY_VERSION}" >> $GITHUB_OUTPUT
          echo "SHA=${SHA}" >> $GITHUB_OUTPUT
          echo "📦 Canary version: ${CANARY_VERSION}"
          echo "🌿 Branch: ${BRANCH}"
          echo "🔑 Commit: ${SHORT_SHA}"

      - name: 🐤 Publish canary packages
        run: node ./release.js --prod --tag canary --snapshot ${{ steps.version.outputs.CANARY_VERSION }}

      - name: 📦 Publish xyd-js canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Read the canary version of @xyd-js/cli from its local package.json
          # (already versioned by changeset in the previous step)
          CANARY_CLI_VERSION=$(node -p "require('./packages/xyd-cli/package.json').version")
          echo "📦 @xyd-js/cli version: ${CANARY_CLI_VERSION}"

          cd packages/xyd-js

          # Write dependency directly into package.json (avoids npm install resolving full dep tree)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@xyd-js/cli'] = '${CANARY_CLI_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4) + '\n');
          "

          # Set canary version on xyd-js package
          npm version 0.0.0-${{ steps.version.outputs.CANARY_VERSION }} --no-git-tag-version

          echo "📦 Publishing xyd-js@0.0.0-${{ steps.version.outputs.CANARY_VERSION }} with canary tag"
          npm publish --tag canary

  # 2) Build the self-contained binaries for every target (reusable workflow).
  binaries:
    name: 🧱 Build binaries
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ github.event.inputs.branch || github.ref }}

  # 3) Create the GitHub Release (prerelease) and attach the compiled binaries.
  release:
    name: 🏷️ Canary GitHub Release
    needs: [ publish, binaries ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: xyd-*
          merge-multiple: true

      - name: 📄 List binaries
        run: ls -la binaries

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.publish.outputs.version }}
          target_commitish: ${{ needs.publish.outputs.sha }}
          name: 🐤 Canary ${{ needs.publish.outputs.version }}
          body: |
            Canary build @ `${{ needs.publish.outputs.sha }}`.

            **npm:** `xyd-js@0.0.0-${{ needs.publish.outputs.version }}` (dist-tag `canary`)
            ```bash
            bun add -g xyd-js@canary   # or: npm i -g xyd-js@canary
            ```

            **Self-contained binaries** (node-free) are attached below — download the one for your platform, `chmod +x`, and run `xyd build` / `xyd dev`.
          prerelease: true
          make_latest: false
          files: binaries/xyd-*
