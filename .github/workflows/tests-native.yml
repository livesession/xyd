name: tests:native

# S6+ per-PR native gate (cheap, single runner — the heavy 3-target embed matrix
# lives in binary-targets.yml):
#   tier 1 — cargo fmt/clippy/test on the crates/ workspace, including the
#            fixture-parity + oracle round-trip tests (they read the committed
#            packages/*/__fixtures__ oracles from the checkout).
#   tier 2 — build the napi .node (debug — parity is value-equality, not perf)
#            and run the through-shim vitest suites of MIGRATED packages in both
#            modes (XYD_NATIVE=1 native / XYD_NATIVE=0 frozen JS fallback).

on:
  push:
    branches: [ master, canary ]
    paths:
      - 'crates/**'
      # The submodule GITLINKS. A change INSIDE xwrite/opensdk appears in this
      # repo as a modification of the path `xwrite` / `opensdk` itself (mode
      # 160000), NOT as `xwrite/**` — there are no parent-tracked files under
      # them, so a `/**` glob would never match and the native gate would
      # silently skip.
      - 'xwrite'
      - 'opensdk'
      - 'apitoolchain'
      - '.gitmodules'
      - 'packages/xyd-native/**'
      - 'packages/xyd-content/**'
      - 'packages/xyd-plugin-docs/**'
      - 'packages/xyd-opensdk-*/**'
      - 'packages/xyd-composer/**'
      - 'packages/xyd-mcp/**'
      - 'packages/xyd-documan/**'
      - '.github/workflows/tests-native.yml'
  pull_request:
    branches: [ master, canary ]
    paths:
      - 'crates/**'
      # The submodule GITLINKS. A change INSIDE xwrite/opensdk appears in this
      # repo as a modification of the path `xwrite` / `opensdk` itself (mode
      # 160000), NOT as `xwrite/**` — there are no parent-tracked files under
      # them, so a `/**` glob would never match and the native gate would
      # silently skip.
      - 'xwrite'
      - 'opensdk'
      - 'apitoolchain'
      - '.gitmodules'
      - 'packages/xyd-native/**'
      - 'packages/xyd-content/**'
      - 'packages/xyd-plugin-docs/**'
      - 'packages/xyd-opensdk-*/**'
      - 'packages/xyd-composer/**'
      - 'packages/xyd-mcp/**'
      - 'packages/xyd-documan/**'
      - '.github/workflows/tests-native.yml'
  workflow_dispatch:

jobs:
  cargo:
    name: cargo (fmt + clippy + parity tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # The Rust build path-deps BOTH submodules — xwrite (crates/xyd_cli ->
        # third-party/markdown-fork, packages/xyd-native -> crates/xwrite_*) and
        # opensdk (crates/xyd_openapi -> oas_doc, packages/xyd-native -> the
        # emitters) — so without this `cargo metadata` cannot even load the
        # workspace. NOT `recursive`: `examples` has nested submodules nothing
        # here needs.
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-crates-${{ hashFiles('crates/**/Cargo.toml', 'xwrite/**/Cargo.toml', 'opensdk/Cargo.lock', 'apitoolchain/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crates-

      - name: fmt
        working-directory: crates
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: crates
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No Node/pnpm here: the only cargo test that needed node_modules was the
      # xyd_mdx parity render (__fixtures__/mdx-parity/_harness/render.mjs), and
      # it left with the crate for the xwrite submodule — where the xwrite job
      # below installs its own harness. Nothing under crates/ shells out to
      # node/npx/pnpm any more, so a full monorepo `pnpm i` on every run of this
      # job bought nothing.
      - name: test (incl. fixture parity + oracle round-trip)
        working-directory: crates
        run: cargo test --workspace

  # The content engine lives in the `xwrite` submodule now, so its ~336 tests
  # (incl. the 241 in the vendored markdown/mdxjs forks) are no longer part of
  # `cargo test --workspace` above. Run them here so a single xyd PR gate still
  # covers the engine. This DOES duplicate xwrite's own CI, deliberately: it is
  # the only thing that catches a gitlink bump which is green standalone but red
  # under xyd's toolchain/feature unification.
  xwrite:
    name: xwrite (content engine, from the submodule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xwrite/target
          key: ${{ runner.os }}-cargo-xwrite-${{ hashFiles('xwrite/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xwrite-

      - name: fmt
        working-directory: xwrite
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: xwrite
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # Install from INSIDE xwrite. Installing at the xyd root would let the mdx
      # harness resolve react from xyd's hoisted node_modules, making the gate
      # pass here and fail in a standalone xwrite clone.
      - name: Install xwrite's JS harness deps
        working-directory: xwrite
        run: npm ci

      - name: test (mdx parity + highlight goldens + math equivalence + forks)
        working-directory: xwrite
        env:
          XWRITE_REQUIRE_PARITY: "1"
        run: cargo test --workspace

  # Same deal as xwrite: the SDK/CLI toolchain lives in the `opensdk` submodule
  # now, so its crates are no longer members of the crates/ workspace and
  # `cargo test --workspace` above does not reach them (they build only as
  # out-of-workspace path deps). Run opensdk's own suite here so one xyd PR gate
  # still covers the toolchain — deliberately duplicating opensdk's CI, because
  # this is the only thing that catches a gitlink bump which is green standalone
  # but red under xyd's toolchain/feature unification.
  #
  # The XYD_SMOKE_* / XYD_CLI_SMOKE_* tiers are left UNSET on purpose: they need
  # five extra language toolchains and are owned by opensdk's own ci.yml. What
  # runs here is the offline golden + unit layer.
  opensdk:
    name: opensdk (sdk/cli toolchain, from the submodule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The opensdk workspace is rooted at the SUBMODULE ROOT (not at its
      # crates/), so every cargo invocation below runs from `opensdk` and its
      # build tree is `opensdk/target`.
      - name: Setup cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            opensdk/target
          key: ${{ runner.os }}-cargo-opensdk-${{ hashFiles('opensdk/Cargo.lock', 'apitoolchain/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-opensdk-

      - name: fmt
        working-directory: opensdk
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: opensdk
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (emitter goldens + converter fixtures + write lifecycle)
        working-directory: opensdk
        run: cargo test --workspace

  # NOTE: the `cli-smokes` tier (generate a real SDK per language, run it against
  # the recording CLI, diff the ACTUAL argv it spawned) used to live here. The
  # seven emitter crates it drives moved into the `opensdk` submodule, and so did
  # the tier — it is the `cli-smokes` job of opensdk's own `.github/workflows/ci.yml`,
  # which owns the five extra language toolchains it needs. The coverage was NOT
  # dropped; the `opensdk` job above is xyd's gitlink-bump gate over that repo.

  ffi:
    name: ffi (napi build + through-shim vitest, both modes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # The Rust build path-deps BOTH submodules — xwrite (crates/xyd_cli ->
        # third-party/markdown-fork, packages/xyd-native -> crates/xwrite_*) and
        # opensdk (crates/xyd_openapi -> oas_doc, packages/xyd-native -> the
        # emitters) — so without this `cargo metadata` cannot even load the
        # workspace. NOT `recursive`: `examples` has nested submodules nothing
        # here needs.
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # `pnpm build` fans out to every package, including the bun-built
      # @xyd-js/ask-ai-edge (`bun build …`), so bun must be on PATH — matching
      # every other workflow that runs the full build.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo cache (napi crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/xyd-native/target
          key: ${{ runner.os }}-cargo-native-debug-${{ hashFiles('crates/**/Cargo.toml', 'xwrite/**/Cargo.toml', 'opensdk/Cargo.lock', 'apitoolchain/Cargo.lock', 'packages/xyd-native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-debug-

      - name: Install dependencies
        run: pnpm i

      - name: Build native core (debug)
        run: pnpm --filter @xyd-js/native build:native:debug

      - name: Native smoke (classify + hello)
        run: node -e "const n=require('./packages/xyd-native/index.js'); if(n.classify('docs.json')!=='settings')throw new Error('classify broken'); console.log('ok:', n.hello('ci'))"

      # Build the JS packages so cross-`@xyd-js/*` imports (which resolve to
      # dist, gitignored) are fresh — @xyd-js/opensdk-uniform below reaches the
      # migrated @xyd-js/openapi + @xyd-js/uniform only through their dist.
      - name: Build packages
        run: pnpm build

      # Through-shim parity of MIGRATED packages, both modes. One block per
      # migrated package. Uses vitest directly — the shims resolve @xyd-js/native
      # from the workspace-linked debug build above.
      - name: through-shim vitest (XYD_NATIVE=1 then =0)
        run: |
          # W1 gql · W2 openapi · W3 uniform (+ mcp rider, fused endpoint via
          # plugin-docs) · W4 content frontmatter batch.
          # W7 codegen (opencli2go/2rust + the opensdk emitters) is gone from
          # this list: those TS packages were deleted when the toolchain became
          # Rust-only in the `opensdk` submodule — the `opensdk` job gates it.
          # M1 highlighter: xyd-content carries the both-mode highlight shim test
          # (__tests__/highlight-native.test.ts) — native xyd_highlight ⇄ codehike
          # fallback; the crate's own cargo tests (cargo job) gate byte-parity.
          #
          # XYD_REQUIRE_NATIVE=1 on the =1 leg is load-bearing. Every shim loader
          # ends in `catch { return null }` and every call site is `if (native?.fn)`,
          # so without it a failed addon load makes the "native" leg run impl-js
          # and report green — the two legs become the SAME run. Verified by
          # hiding packages/xyd-native/*.node and re-running: `XYD_NATIVE=1` still
          # said "14 passed", identical to the real native run. With the flag the
          # same experiment fails at import. Never drop it from this line.
          # Four of the six moved to the `apitoolchain` submodule with the crates
          # behind them. They stay in THIS loop rather than moving to
          # apitoolchain's CI: the addon is built here (it compiles those very
          # crates), so xyd is the only place where BOTH halves of the
          # differential exist. apitoolchain's own CI runs the =0 half only, and
          # says so.
          SHIM_PKGS="apitoolchain/packages/xyd-gql apitoolchain/packages/xyd-openapi apitoolchain/packages/xyd-uniform apitoolchain/packages/xyd-mcp-uniform packages/xyd-content packages/xyd-plugin-docs"
          for pkg in $SHIM_PKGS; do
            if [ -d "$pkg/__tests__" ]; then
              echo "=== $pkg (native=1) ==="; (cd "$pkg" && XYD_NATIVE=1 XYD_REQUIRE_NATIVE=1 npx vitest run)
              echo "=== $pkg (native=0) ==="; (cd "$pkg" && XYD_NATIVE=0 npx vitest run)
            else
              echo "::error::$pkg has no __tests__ — the path is wrong, so this leg tested nothing."
              exit 1
            fi
          done

      # NATIVE-ONLY, deliberately not in the both-modes loop above: this package
      # throws on XYD_NATIVE=0 (no JS fallback — the JS emitters that were the
      # other half of the differential were deleted with the TypeScript cluster),
      # so a =0 pass would abort the step under `bash -e`. It runs HERE rather
      # than in tests:unit because it needs the .node built above, and the root
      # vitest config excludes it for the same reason.
      - name: vitest xyd-opensdk-uniform (native only)
        # No XYD_REQUIRE_NATIVE here: this package resolves @xyd-js/native
        # eagerly and THROWS on failure already (src/index.ts:55-64), so it has
        # no loader reading that flag — setting it would imply a guard that
        # isn't there.
        run: cd packages/xyd-opensdk-uniform && XYD_NATIVE=1 npx vitest run
