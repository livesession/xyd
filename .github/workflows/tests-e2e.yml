name: tests:e2e

on:
  workflow_run:
    workflows: ["👷‍♂️ Build Release"]
    branches: [master]
    types: [completed]

  workflow_dispatch:
    inputs:
      xyd_version:
        description: 'xyd-js version to install (e.g. "canary", "0.1.0-alpha.6", "latest")'
        required: false
        default: ''
      branch:
        description: 'Branch to checkout tests from'
        required: false
        default: ''

jobs:
  test:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        node-version: [22.12.0]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
        # apitoolchain is a pnpm workspace MEMBER (it holds the five converter
        # shims), so `pnpm i` fails outright without it:
        #   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND ... no package named "@xyd-js/gql"
        # NOT `recursive`: `examples` has nested submodules nothing here needs.
        submodules: true

    - name: 🟢 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.10.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 'latest'

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm i

    - name: Install Playwright browsers
      run: pnpm exec playwright install

    - name: 🔧 Install xyd-js CLI
      run: |
        # Check if a custom version was provided via workflow_dispatch
        CUSTOM_VERSION="${{ github.event.inputs.xyd_version }}"

        if [ -n "$CUSTOM_VERSION" ]; then
          echo "📦 Installing xyd-js@${CUSTOM_VERSION} (manual)"
          npm i -g xyd-js@${CUSTOM_VERSION}
        else
          # Auto-detect from workflow_run (snapshot build)
          BUILD_VERSION="${{ github.event.workflow_run.outputs.BUILD_VERSION }}"
          if [ -z "$BUILD_VERSION" ]; then
            SHA=$(git rev-parse HEAD)
            SHORT_SHA=${SHA::7}
            BUILD_VERSION=build-${SHORT_SHA}
          fi

          SHORT_SHA=${BUILD_VERSION#build-}

          # WAIT for the version to appear. Build Release reports success when
          # `npm publish` returns, but npm does not make the version queryable
          # until noticeably later — measured on run 35512872074:
          #   13:13:28  Build Release finishes, green
          #   13:13:30  this job starts
          #   13:15:06  @xyd-js/cli 0.0.0-build-2d8edf9-* becomes visible
          # i.e. the package landed 96s AFTER we looked for it. Retrying the
          # install alone cannot help, because discovery exits first.
          for attempt in 1 2 3 4 5 6; do
            LATEST_BUILD_VERSION=$(npm view @xyd-js/cli versions --json --prefer-online 2>/dev/null \
              | jq -r '.[] | select(test("^0\\.0\\.0-build-'${SHORT_SHA}'-[0-9]+$")) | .' | sort -V | tail -n1)
            [ -n "$LATEST_BUILD_VERSION" ] && break
            if [ "$attempt" -eq 6 ]; then
              echo "❌ No build version found for SHA: ${SHORT_SHA} after 6 attempts"
              echo "::error::@xyd-js/cli has no 0.0.0-build-${SHORT_SHA}-* version after ~3.75min."
              echo "::error::If Build Release was green, the publish never reached the registry; check its publish step."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "not visible yet (attempt ${attempt}/6); retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "✅ Resolved ${LATEST_BUILD_VERSION}"

          echo "📦 Installing @xyd-js/cli@${LATEST_BUILD_VERSION}"
          # This job starts seconds after Build Release finishes publishing ~53
          # packages, and npm can serve a stale packument for a while afterwards.
          # The observed failure is asymmetric and confusing: @xyd-js/cli resolves
          # at the new version while its SAME-VERSION dependency @xyd-js/host
          # still appears absent —
          #   ERR_PNPM_NO_MATCHING_VERSION  No matching version found for
          #   @xyd-js/host@0.0.0-build-<sha>-<ts>
          # with npm reporting a "latest" from weeks earlier. Both were in fact
          # published. Retry with --prefer-online so each attempt re-fetches the
          # packument instead of replaying the cached miss.
          for attempt in 1 2 3 4 5; do
            # No --prefer-online here: `npm` accepts that flag but `pnpm add`
            # does not ("Unknown option: 'prefer-online'. Did you mean
            # 'prefer-offline'?"), so every attempt failed instantly on argument
            # parsing rather than on the registry — five retries in a couple of
            # seconds, reported as if the package were unresolvable. It is not
            # needed anyway: the discovery step above already confirmed the
            # version is visible, and a version published minutes ago cannot be
            # in this runner's cold pnpm cache.
            if pnpm add -g "@xyd-js/cli@${LATEST_BUILD_VERSION}" \
                 --registry=https://registry.npmjs.org; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::@xyd-js/cli@${LATEST_BUILD_VERSION} still unresolvable after 5 attempts."
              echo "::error::If its dependencies are genuinely missing, the publish was partial — check Build Release."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "attempt ${attempt} failed; registry likely still stale, retrying in ${delay}s"
            sleep "${delay}"
          done
        fi

        echo "✅ Installed version:"
        xyd --version || echo "(version command not available)"

    - name: 📦 Start Verdaccio (local registry for e2e tests)
      run: |
        npm install -g verdaccio
        verdaccio --config __tests__/e2e/verdaccio-ci-config.yaml &
        # Wait for Verdaccio to be ready
        for i in $(seq 1 30); do
          curl -sf http://localhost:4873 > /dev/null 2>&1 && break
          sleep 1
        done
        # Create user and save auth token for publishing
        TOKEN=$(curl -s -XPUT -H "Content-Type: application/json" \
          -d '{"name":"test","password":"test"}' \
          http://localhost:4873/-/user/org.couchdb.user:test | jq -r '.token')
        echo "//localhost:4873/:_authToken=\"${TOKEN}\"" >> ~/.npmrc
        echo "✅ Verdaccio is running on http://localhost:4873"

    - name: 🧪 Run E2E tests
      run: pnpm run test:e2e
      env:
        XYD_E2E_VERDACCIO_URL: http://localhost:4873
