name: tests:e2e

on:
  workflow_run:
    workflows: ["👷‍♂️ Build Release"]
    branches: [master]
    types: [completed]

  workflow_dispatch:
    inputs:
      xyd_version:
        description: 'xyd-js version to install (e.g. "canary", "0.1.0-alpha.6", "latest")'
        required: false
        default: ''
      branch:
        description: 'Branch to checkout tests from'
        required: false
        default: ''

jobs:
  test:
    name: 🧪 E2E Tests
    runs-on: ubuntu-24.04
    # The whole suite builds a docs site per case; it ran past 30 minutes when it
    # got to run at all.
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      matrix:
        node-version: [22.12.0]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
        # apitoolchain is a pnpm workspace MEMBER (it holds the five converter
        # shims), so `pnpm i` fails outright without it:
        #   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND ... no package named "@xyd-js/gql"
        # NOT `recursive`: `examples` has nested submodules nothing here needs.
        submodules: true

    - name: 🟢 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.10.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 'latest'

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm i

    - name: Install Playwright browsers
      run: pnpm exec playwright install

    - name: 🔧 Install xyd-js CLI
      run: |
        # Check if a custom version was provided via workflow_dispatch
        CUSTOM_VERSION="${{ github.event.inputs.xyd_version }}"

        if [ -n "$CUSTOM_VERSION" ]; then
          echo "📦 Installing xyd-js@${CUSTOM_VERSION} (manual)"
          npm i -g xyd-js@${CUSTOM_VERSION}
          # No @xyd-js/mcp-server of that version to pair with: the server suites skip.
        else
          # Auto-detect from workflow_run (snapshot build)
          BUILD_VERSION="${{ github.event.workflow_run.outputs.BUILD_VERSION }}"
          if [ -z "$BUILD_VERSION" ]; then
            SHA=$(git rev-parse HEAD)
            SHORT_SHA=${SHA::7}
            BUILD_VERSION=build-${SHORT_SHA}
          fi

          SHORT_SHA=${BUILD_VERSION#build-}

          # Find the snapshot's full version (0.0.0-build-<sha>-<timestamp>). Build
          # Release reports success when `npm publish` returns; the version shows up
          # in the registry a little later, so look for it a few times.
          for attempt in 1 2 3 4 5 6; do
            LATEST_BUILD_VERSION=$(npm view @xyd-js/cli versions --json --prefer-online 2>/dev/null \
              | jq -r '.[] | select(test("^0\\.0\\.0-build-'${SHORT_SHA}'-[0-9]+$")) | .' | sort -V | tail -n1)
            [ -n "$LATEST_BUILD_VERSION" ] && break
            if [ "$attempt" -eq 6 ]; then
              echo "::error::@xyd-js/cli has no 0.0.0-build-${SHORT_SHA}-* version after ~3.75min."
              echo "::error::If Build Release was green, the publish never reached the registry; check its publish step."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "not visible yet (attempt ${attempt}/6); retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "✅ Resolved ${LATEST_BUILD_VERSION}"

          # Wait until the registry can INSTALL it. `npm view` reads the full package
          # document; pnpm resolves from the abbreviated install document, which the
          # registry's CDN refreshes on its own schedule — for minutes after a publish
          # of ~50 packages, a different sibling (@xyd-js/host, /documan, /framework…)
          # is missing on each try, and every blind retry of the install failed with
          # ERR_PNPM_NO_MATCHING_VERSION. The script polls that install document for
          # the CLI, the MCP server and every @xyd-js dependency they pin to this
          # version, and only then lets the install run.
          node scripts/wait-for-npm-release.mjs --timeout 1200 \
            "@xyd-js/cli@${LATEST_BUILD_VERSION}" \
            "@xyd-js/mcp-server@${LATEST_BUILD_VERSION}"

          for attempt in 1 2 3; do
            if pnpm add -g "@xyd-js/cli@${LATEST_BUILD_VERSION}" "@xyd-js/mcp-server@${LATEST_BUILD_VERSION}" \
                 --registry=https://registry.npmjs.org; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::@xyd-js/cli@${LATEST_BUILD_VERSION} did not install although the registry lists every package it pins."
              exit 1
            fi
            # Drop pnpm's cached package documents so the next try reads the registry again.
            rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/metadata"* 2>/dev/null || true
            echo "attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done

          # The server suites (9.mcp/7-9) run against this published @xyd-js/mcp-server,
          # and must: a missing server fails them instead of skipping them.
          echo "XYD_E2E_MCP_SERVER_BIN=$(pnpm root -g)/@xyd-js/mcp-server/bin/xyd-mcp-server.mjs" >> "$GITHUB_ENV"
          echo "XYD_E2E_REQUIRE_MCP_SERVER=1" >> "$GITHUB_ENV"
        fi

        echo "✅ Installed version:"
        xyd --version || echo "(version command not available)"

    - name: 📦 Start Verdaccio (local registry for e2e tests)
      run: |
        npm install -g verdaccio
        verdaccio --config __tests__/e2e/verdaccio-ci-config.yaml &
        # Wait for Verdaccio to be ready
        for i in $(seq 1 30); do
          curl -sf http://localhost:4873 > /dev/null 2>&1 && break
          sleep 1
        done
        # Create user and save auth token for publishing
        TOKEN=$(curl -s -XPUT -H "Content-Type: application/json" \
          -d '{"name":"test","password":"test"}' \
          http://localhost:4873/-/user/org.couchdb.user:test | jq -r '.token')
        echo "//localhost:4873/:_authToken=\"${TOKEN}\"" >> ~/.npmrc
        echo "✅ Verdaccio is running on http://localhost:4873"

    - name: 🧪 Run E2E tests
      run: pnpm run test:e2e
      env:
        XYD_E2E_VERDACCIO_URL: http://localhost:4873
