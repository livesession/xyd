name: 👷‍♂️ Build Release

on:
  workflow_run:
    workflows: ["tests:unit"]
    branches: [master]
    types: [completed]
    paths:
      - 'packages/**'

jobs:
  cli-release:
    name: 👷‍♂️ Build Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        node-version: [ 22.12.0 ]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # apitoolchain is a pnpm workspace MEMBER (it holds the five converter
          # shims), so `pnpm i` fails outright without it:
          #   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND ... no package named "@xyd-js/gql"
          # NOT `recursive`: `examples` has nested submodules nothing here needs.
          submodules: true

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store- 

      - name: Install the packages
        run: pnpm i

      - name: 🏗 Build packages
        run: pnpm run build

      - name: 🔐 Setup npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Read the token from the environment rather than interpolating
          # ${{ secrets.* }} into the script body, so it is not written into the
          # step's shell file on the runner.
          #
          # An unset or empty secret writes a bare `_authToken=` line, which npm
          # treats as anonymous — and an anonymous PUT is answered with 404, not
          # 401, because npm will not confirm whether a package exists. The first
          # symptom is then 50+ "is not in this registry" errors about packages
          # that plainly are.
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty. Every publish would fail with E404."
            exit 1
          fi
          echo "registry=https://registry.npmjs.org" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc


      - name: 🕵️ Check for changes
        id: version
        run: |
          # get latest commit sha
          SHA=$(git rev-parse HEAD)
          # get first 7 characters of sha
          SHORT_SHA=${SHA::7}
          BUILD_VERSION=build-${SHORT_SHA}
          # set output so it can be used in other jobs
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_OUTPUT

      - name: 🚀 Publish build release
        run: node ./release.js --prod --snapshot ${{ steps.version.outputs.BUILD_VERSION }}
          

    

