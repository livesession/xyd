name: tests:opencli-pipeline

# Verifies the OpenAPI → OpenCLI → CLI pipeline end to end:
#   @xyd-js/opencli (core model) · @xyd-js/openapi2opencli (Stage A)
#   · @xyd-js/opencli2go (Go generator) · @xyd-js/opencli2rust (Rust generator)
#
# The root vitest config (tests:unit) already runs each package's offline unit
# tests, but it EXCLUDES `**/__tests__/e2e/**`. This job adds Go + Rust
# toolchains so the gated layers can run where generated binaries actually
# execute (Linux):
#   - O2G_GO_SMOKE=1    — a sample of generated Go projects `go build`/`go vet`
#   - O2R_CARGO_SMOKE=1 — generated Rust projects `cargo check`
#   - E2E_CLI=1         — assemble the whole CLI, run it against a recording server,
#                         diff the real HTTP requests against the committed fixtures
# (O2G_BUILD_DOCS / O2R_BUILD_DOCS / E2E_RECORD regenerate goldens and are
# deliberately NOT set.)

on:
  push:
    branches: [ master, canary, canary2 ]
    paths:
      - 'packages/xyd-opencli/**'
      - '.github/workflows/tests-opencli-pipeline.yml'
  pull_request:
    branches: [ master, canary, canary2 ]
    paths:
      - 'packages/xyd-opencli/**'
      - '.github/workflows/tests-opencli-pipeline.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.12.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.10.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 'latest'

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        # The generated CLIs vendor urfave/cli v3; cache its module downloads.
        cache: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # The generated Rust CLIs share one target dir so clap/reqwest/tokio compile
    # once across the cargo-check smoke samples and the e2e CLI build.
    - name: Setup cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          /tmp/o2r-target
        key: ${{ runner.os }}-o2r-cargo-${{ hashFiles('crates/xyd_opencli2rust/src/runtime.rs') }}
        restore-keys: |
          ${{ runner.os }}-o2r-cargo-

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm i

    - name: Build pipeline packages (and their workspace deps)
      run: >-
        pnpm
        --filter "@xyd-js/opencli..."
        build

    - name: Test @xyd-js/opencli (core model + schema round-trip)
      run: pnpm --filter @xyd-js/opencli ci:test

    # Decrypt the vendored oracle (openai-cli surface, docs methods, spec) so the
    # conformance + docs-oracle suites actually RUN. Needs the XYD_CONTENT_SECRET
    # repo secret; without it this is a no-op and those suites SKIP gracefully
    # (the tests lazy-load ../oracle/* behind existence guards).