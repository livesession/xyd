name: tests:opencli-pipeline

# Verifies the part of the OpenAPI → OpenCLI → CLI pipeline that still lives in
# this repo: @xyd-js/opencli, the core model + schema round-trip.
#
# Everything downstream of it — Stage A and the Go and Rust generators — is Rust
# now and lives in the `opensdk` submodule (openapi2opencli, opencli2go,
# opencli2rust), gated by opensdk's own ci.yml and re-run by tests-native.yml's
# `opensdk` job on every gitlink bump.
#
# COVERAGE GAP, stated plainly so it is not mistaken for a clean migration: the
# old O2G_GO_SMOKE / O2R_CARGO_SMOKE / E2E_CLI tiers — "does the generated CLI
# compile, and does it send the right HTTP request?" — were TypeScript and were
# DROPPED, not ported. opencli2go and opencli2rust ship only parity.rs, a
# byte-golden compare, and a consistently-emitted syntax error matches its golden
# perfectly. The opensdk EMITTERS do have compile/cli smokes (XYD_SMOKE_<LANG>,
# XYD_CLI_SMOKE_<LANG>); the two CLI GENERATORS have no equivalent yet.

on:
  push:
    branches: [ master, canary, canary2 ]
    paths:
      - 'apitoolchain'
      - '.github/workflows/tests-opencli-pipeline.yml'
  pull_request:
    branches: [ master, canary, canary2 ]
    paths:
      - 'apitoolchain'
      - '.github/workflows/tests-opencli-pipeline.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.12.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      # apitoolchain is a pnpm workspace MEMBER (it holds the five converter
      # shims), so `pnpm i` fails outright without it:
      #   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND ... no package named "@xyd-js/gql"
      # NOT `recursive`: `examples` has nested submodules nothing here needs.
      with:
        submodules: true

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.10.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 'latest'

    # No Go/Rust toolchain here any more: the generators that needed them went to
    # the opensdk submodule, and with them the cargo cache over /tmp/o2r-target.
    # What remains is a TypeScript package with one vitest suite.

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm i

    - name: Build pipeline packages (and their workspace deps)
      run: >-
        pnpm
        --filter "@xyd-js/opencli..."
        build

    - name: Test @xyd-js/opencli (core model + schema round-trip)
      run: pnpm --filter @xyd-js/opencli ci:test