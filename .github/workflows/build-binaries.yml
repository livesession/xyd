name: build:binaries

# Reusable: build the self-contained `bun --compile` xyd binary natively on each
# target platform (Rust napi core → embed → compile → darwin codesign), smoke it
# node-free, and upload each binary as an artifact named `xyd-<triple>`. Called by
# binary-targets.yml (CI on every push, so this stays validated) and by the
# release workflows (canary / prerelease / stable) which download the artifacts
# and attach them to the GitHub release.
#
# TODO(windows): add windows-2022 → bun-windows-x64 (cargo builds the .node
# natively; compile.ts needs no changes — codesign is darwin-gated).

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build from (default: the calling workflow''s ref)'
        required: false
        type: string
        default: ''

jobs:
  binary:
    name: ${{ matrix.bun-target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bun-target: bun-linux-x64
            artifact: xyd-linux-x64
          - os: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
            artifact: xyd-linux-arm64
          - os: macos-14
            bun-target: bun-darwin-arm64
            artifact: xyd-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/xyd-native/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-native-${{ hashFiles('crates/**/Cargo.toml', 'packages/xyd-native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-native-

      - name: Install dependencies
        run: pnpm i

      - name: Build packages
        run: pnpm build

      - name: Build native core (napi .node)
        run: pnpm --filter @xyd-js/native build:native

      - name: Stage native core for the compile
        shell: bash
        run: cp packages/xyd-native/*.node packages/xyd-cli/src/core.node

      - name: Compile the self-contained binary
        working-directory: packages/xyd-cli
        run: bun scripts/compile.ts ${{ matrix.bun-target }}

      - name: 'Smoke: embedded Rust core answers (__nativecheck)'
        shell: bash
        run: |
          BIN="packages/xyd-cli/dist/${{ matrix.artifact }}"
          OUT="$($BIN __nativecheck)"
          echo "$OUT"
          echo "$OUT" | grep -q "hello xyd from xyd rust core"
          echo "$OUT" | grep -q "classify(docs.json): settings"

      - name: 'Smoke: node-free xyd build emits real HTML'
        shell: bash
        run: |
          BIN="$PWD/packages/xyd-cli/dist/${{ matrix.artifact }}"
          SITE="$RUNNER_TEMP/binary-smoke"
          mkdir -p "$SITE/content"
          printf '{ "theme": { "name": "poetry" }, "navigation": { "sidebar": ["index", "content/intro"] } }\n' > "$SITE/docs.json"
          printf -- '---\ntitle: Home\ndescription: smoke\n---\n# Binary Smoke Marker\nBuilt by the compiled binary.\n' > "$SITE/index.md"
          printf -- '---\ntitle: Intro\ndescription: page\n---\n# Intro\n\n```js\nconst ok = true;\n```\n' > "$SITE/content/intro.md"
          cd "$SITE"
          "$BIN" --version
          "$BIN" build
          test -f .xyd/build/client/index.html
          test -f .xyd/build/client/content/intro.html
          grep -q "Binary Smoke Marker" .xyd/build/client/index.html
          # syntax highlighting came through the embedded render bundle
          grep -q "<span style" .xyd/build/client/content/intro.html
          echo "smoke ok: $(wc -c < .xyd/build/client/index.html) bytes index.html"

      - name: 'Smoke: darwin binary is codesigned with allow-jit'
        if: matrix.os == 'macos-14'
        run: |
          codesign -d --entitlements - packages/xyd-cli/dist/${{ matrix.artifact }} | grep -q "allow-jit"
          echo "codesign entitlements ok"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/xyd-cli/dist/${{ matrix.artifact }}
          if-no-files-found: error
