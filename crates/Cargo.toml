# xyd Rust workspace. Rooted at crates/ (NOT the repo root) so it never captures
# the generated Rust projects elsewhere in the repo (packages/apitoolchain-api-cli,
# packages/xyd-opencli2rust/__fixtures__/**, packages/xyd-opensdk-rust/__fixtures__/**),
# which are standalone crates built by their own `cargo` smoke tests.
[workspace]
resolver = "2"
members = [
    "xyd_core_rs",
    "xyd_watch",
    "xyd_uniform",
    "xyd_parity",
    "xyd_gql",
    "xyd_openapi",
    "xyd_mcp_uniform",
    "xyd_settings",
    "xyd_opencli_uniform",
    "xyd_oas_snippet",
    "xyd_cli",
]
# The 22 SDK/CLI-toolchain crates that used to be listed above now live in the
# `opensdk` submodule (github.com/livesession/opensdk) and are consumed from
# `../opensdk/crates/*`. Two of them are depended on from THIS workspace:
# `oas_doc` (the shared spec loader/dereferencer, a production dep of
# xyd_openapi) and `parity_kit` (whose vendored copy xyd_parity drift-checks).
# Like the xwrite forks below, out-of-workspace path deps build normally but are
# NOT covered by `cargo fmt --all` / `cargo clippy --workspace` here — opensdk's
# own CI owns linting them.
# The napi adapter crate lives co-located in packages/xyd-native (idiomatic
# napi-rs layout: crate + package.json together). It path-depends on
# crates/xyd_core_rs and is built standalone by @napi-rs/cli, so it is NOT a
# member of this workspace. RULE (S6+, amended for the xwrite and opensdk
# extractions): the napi crate may depend only on
# napi/napi-derive/napi-build/serde_json + path-deps on (a) crates/* here,
# (b) xwrite/crates/xwrite_* — the pinned `xwrite` submodule
# (github.com/livesession/xwrite), which owns the content engine
# (frontmatter/highlight/math/mdx + the vendored markdown/mdxjs forks) — and
# (c) opensdk/crates/xyd_* — the pinned `opensdk` submodule
# (github.com/livesession/opensdk), which owns the SDK/CLI toolchain.
# All logic/parser/IO deps still live in pure crates on both sides, so the dual
# lockfile (crates/Cargo.lock vs packages/xyd-native/Cargo.lock) can't skew
# behavior.
#
# NOTE: crates/xyd_cli path-deps `markdown` out of the submodule
# (../../xwrite/third-party/markdown-fork). That path is OUTSIDE this workspace
# directory, so cargo does NOT auto-adopt it as a member — it builds as an
# ordinary dependency and is NOT covered by `cargo fmt --all` /
# `cargo clippy --workspace` here. xwrite's own CI owns linting the forks.

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"

# Shared third-party pins (S6+): every pure crate takes these via
# `{ workspace = true }` so converter crates can't drift among themselves.
# preserve_order: fixture-dump diffs stay minimal AND IndexMap equality is
# order-insensitive — exactly the vitest `toEqual` oracle semantics.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# CLI-only pins (crates/xyd_cli). Kept here so the generated command tree and the
# hand-owned shim share one clap/tokio version, matching the repo pattern.
clap = { version = "4", features = ["string"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal"] }
# Content-addressed cache key for the embedded engine (crates/xyd_cli S4): the
# extract dir is `~/.xyd/cache/engine/<hex(sha256(engine))[..16]>/`.
sha2 = "0.10"
# Native static file server for `xyd serve` (crates/xyd_cli S5): a small, blocking,
# dependency-light HTTP server — deliberately NOT a heavy async stack just to serve
# the prebuilt `.xyd/build/client/` tree.
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
