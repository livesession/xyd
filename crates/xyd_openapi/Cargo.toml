[package]
name = "xyd_openapi"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# W2 of the S6+ Rust migration: OpenAPI 3.x → Uniform Reference[] — the Rust
# port of packages/xyd-openapi's conversion pipeline. Endpoint code-sample
# generation (@readme/oas-to-snippet) intentionally stays a JS post-pass in the
# shim; component-schema JSON examples ARE generated here. The frozen fixtures
# are the spec (tier-1 compares with endpoint examples stripped; tier-2 through
# the shim covers the combined output).

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
# The spec loader/dereferencer moved to the `opensdk` submodule, which owns the
# SDK/CLI toolchain that shares it. Being outside this workspace directory, it
# builds as an ordinary dependency but is NOT covered by `cargo fmt --all` /
# `cargo clippy --workspace` here; opensdk's CI lints it. A missing checkout
# fails at manifest-load with the path in the message — see scripts/ensure-submodules.mjs.
oas_doc = { path = "../../opensdk/crates/oas_doc" }
xyd_uniform = { path = "../xyd_uniform" }

[dev-dependencies]
xyd_parity = { path = "../xyd_parity" }
