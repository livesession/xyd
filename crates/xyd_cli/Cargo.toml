# Hand-owned (protected by .sdkignore): a workspace-integrated manifest for the
# generated `xyd` CLI. The command tree in src/gen/** is regenerated from
# opencli.json by regen.mjs; this file, src/main.rs, and src/custom/** survive
# regeneration. clap/tokio are pinned in crates/Cargo.toml [workspace.dependencies]
# (repo pattern); reqwest/serde_json/percent-encoding are the runtime deps the
# vendored src/gen/** still references (dead for a local tool — dead-code warnings
# are expected — but needed to COMPILE).

[package]
name = "xyd_cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "xyd"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
percent-encoding = "2"
# S4: content-hash the embedded engine to key its extract dir. Only referenced
# under cfg(xyd_has_embedded_engine) in src/custom/engine.rs; unused (no compile
# cost beyond building the crate) in the fast, non-embedded dev build.
sha2 = { workspace = true }
# S5: native `xyd serve` static file server. A missing build dir errors and an edge
# deploy (`server.mjs`) still delegates to the embedded engine; the plain static
# case is served here. Small/blocking — no async HTTP stack pulled in.
tiny_http = { workspace = true }
# unix-only: forward the EXACT termination signal (SIGINT/SIGTERM/SIGHUP) to the
# spawned bun engine via kill(2) so it can run its own graceful teardown. Already
# in the tree transitively (tokio); pinned here as a direct dep for `src/custom/engine.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
