[project]
name = "union-depot"
version = "0.4.0"
description = "Handcrafted IR exercising discriminated-union decode, const auto-fill and auto-pagers."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["union_depot"]
