[package]
name = "acme"
version = "1.0.0"
edition = "2021"
description = "Rust client for the acme API"
license = "MIT"

[workspace]

# Field docs are OpenAPI descriptions (arbitrary markdown), not Rust doctests.
[lib]
doctest = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
