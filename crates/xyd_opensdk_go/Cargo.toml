[package]
name = "xyd_opensdk_go"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Go SDK emitter — OpenSDK IR -> generated Go SDK code (Rust port of @xyd-js/opensdk-go; generated-code emitter, vendored runtime + tests deferred)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
xyd_opensdk_cli_common = { path = "../xyd_opensdk_cli_common" }
xyd_opensdk_core = { path = "../xyd_opensdk_core" }

[dev-dependencies]
# DEV-ONLY: spawns language toolchains; must never become a real dependency
# (these crates link into the @xyd-js/native cdylib).
xyd_opensdk_e2e = { path = "../xyd_opensdk_e2e" }
xyd_opensdk_cli_common = { path = "../xyd_opensdk_cli_common" }
