[package]
name = "xyd_opensdk_config"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Rust port of opensdk-core's config.ts + spec.ts: the declarative sdk.json/chain.json shapes, mergePublishTargets, and the OpenSDK spec loader/lookup helpers"
publish = false

# BOUNDARY: pure data + pure functions, plus ONE IO entry point
# (`load_opensdk_spec`, the port of `loadOpensdkSpec`'s file half). No parser, no
# network, no third-party dep beyond serde/serde_json/thiserror.
#
# `walk_methods` is NOT redefined here — it was already ported into
# xyd_opensdk_core::emitter, and `spec::walk_methods` re-exports it so there is
# exactly one implementation in the workspace.

[dependencies]
serde = { workspace = true }
# MANDATORY `workspace = true`: `preserve_order` is load-bearing here. sdk.json's
# `grouping.mountRules` is scanned longest-prefix-first with a strict `>`, so on a
# length tie the FIRST entry sticks — key order changes which rule applies. A
# bare `serde_json = "1"` would hand back a BTreeMap and silently re-sort it.
serde_json = { workspace = true }
thiserror = { workspace = true }
xyd_opensdk_core = { path = "../xyd_opensdk_core" }
