[package]
name = "xyd_oas_snippet"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Rust port of @readme/oas-to-snippet@28.0.4 + the parts of
# @readme/httpsnippet@11.1.0 that xyd uses — endpoint request code samples
# (curl / fetch / requests / go-native) for the four languages
# packages/xyd-openapi emits (shell, javascript, python, go). It reproduces the
# oas → HAR builder (@readme/oas-to-har@26.0.4, over the oas@25.3.0 Operation
# model) and the four httpsnippet clients, byte-for-byte.
#
# The committed __fixtures__/<case>/output.json goldens are generated by the
# REAL JS toolchain (oracle/gen.mjs, run against @readme/oas-to-snippet); the
# Rust never rewrites them. tests/parity.rs asserts byte-equality per language.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
xyd_parity = { path = "../xyd_parity" }
