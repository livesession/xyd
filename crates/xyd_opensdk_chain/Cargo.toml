[package]
name = "xyd_opensdk_chain"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Chain source-processing engine (Rust port of @xyd-js/opensdk-chain's chain.ts + sources.ts): detect/resolve chain.json, read raw OpenAPI docs, merge inputs, apply OpenAPI Overlay 1.0.0"

[dependencies]
serde = { workspace = true }
# MANDATORY `workspace = true`: `preserve_order` makes serde_json's Map an IndexMap,
# which is what reproduces JS object key-insertion order. Every merged document and
# every serialised spec in this crate is byte-compared against a JS-produced golden,
# so a BTreeMap here would reorder every key.
serde_json = { workspace = true }
thiserror = { workspace = true }
# YAML input (readRawDoc) + YAML output (serializeDoc). Same pin as xyd_openapi.
serde_yaml = "0.9"
# RFC 9535 JSONPath for overlay `target`s. jsonpath-plus (the TS engine) is NOT
# RFC 9535 — see src/jsonpath.rs and tests/jsonpath_sweep.rs.
serde_json_path = "0.7"
