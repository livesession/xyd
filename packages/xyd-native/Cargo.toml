[package]
name = "xyd_native"
version = "0.0.0"
edition = "2021"
publish = false

# The ONE napi crate → becomes @xyd-js/native's .node addon. Standalone (built
# by @napi-rs/cli); path-depends on the pure crate in crates/.
[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = { version = "1", features = ["preserve_order"] }
xyd_core_rs = { path = "../../crates/xyd_core_rs" }
xyd_watch = { path = "../../crates/xyd_watch" }
xyd_gql = { path = "../../crates/xyd_gql" }
xyd_openapi = { path = "../../crates/xyd_openapi" }
xyd_oas_snippet = { path = "../../crates/xyd_oas_snippet" }
xyd_opencli_uniform = { path = "../../crates/xyd_opencli_uniform" }
xyd_uniform = { path = "../../crates/xyd_uniform" }
xyd_mcp_uniform = { path = "../../crates/xyd_mcp_uniform" }
xyd_settings = { path = "../../crates/xyd_settings" }

# ── SDK/CLI toolchain (the pinned `opensdk` submodule at <repo>/opensdk) ─────
# github.com/livesession/opensdk. The converters + the seven emitters + the
# breaking-change differ: everything reachable from `xyd opensdk` and from the
# api-toolchain codegen. They keep their `xyd_*` names — the extraction
# preserved every git tree hash, and renaming would have discarded that proof.
openapi2opensdk = { path = "../../opensdk/crates/openapi2opensdk" }
openapi2opencli = { path = "../../opensdk/crates/openapi2opencli" }
opensdk_diff = { path = "../../opensdk/crates/opensdk_diff" }
opencli2go = { path = "../../opensdk/crates/opencli2go" }
opencli2rust = { path = "../../opensdk/crates/opencli2rust" }
opensdk_go = { path = "../../opensdk/crates/opensdk_go" }
opensdk_node = { path = "../../opensdk/crates/opensdk_node" }
opensdk_python = { path = "../../opensdk/crates/opensdk_python" }
opensdk_ruby = { path = "../../opensdk/crates/opensdk_ruby" }
opensdk_java = { path = "../../opensdk/crates/opensdk_java" }
opensdk_dotnet = { path = "../../opensdk/crates/opensdk_dotnet" }
opensdk_rust = { path = "../../opensdk/crates/opensdk_rust" }

# ── content engine (the pinned `xwrite` submodule at <repo>/xwrite) ──────────
# github.com/livesession/xwrite. xwrite_math arrives transitively via
# xwrite_mdx; xwrite_highlight_wasm is wasm-only and never referenced here.
xwrite_frontmatter = { path = "../../xwrite/crates/xwrite_frontmatter" }
xwrite_highlight = { path = "../../xwrite/crates/xwrite_highlight" }
xwrite_mdx = { path = "../../xwrite/crates/xwrite_mdx" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
