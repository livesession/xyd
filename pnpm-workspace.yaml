packages:
  - 'apps/apidocs-demo'
  - 'packages/*'
  - 'specs/*'
  # The five converter shims moved to the `apitoolchain` submodule together with
  # the crates behind them. Listed EXPLICITLY, never as a glob: the rest of
  # apitoolchain/packages/ is standalone bun islands with their own lockfiles,
  # which a glob would adopt and break `pnpm i` on.
  - 'apitoolchain/packages/xyd-uniform'
  - 'apitoolchain/packages/xyd-gql'
  - 'apitoolchain/packages/xyd-openapi'
  - 'apitoolchain/packages/xyd-mcp-uniform'
  - 'apitoolchain/packages/xyd-opencli'
  - packages/xyd-ask-ai/examples/*
  - '!packages/xyd-js'
  # standalone bun package (own @apitoolchain scope), managed outside the @xyd-js pnpm workspace
  - '!packages/apitoolchain-design-system'
  - '!packages/apitoolchain-auth-design-system'
  - '!packages/apitoolchain-sdkjson-wizard'
  # apitoolchain support packages: consumed by the standalone bun apps via file:
  # deps (schemas is tsp source; dev is the testcontainers dev-vite plugin)
  - '!packages/apitoolchain-schemas'
  - '!packages/apitoolchain-dev'
  - '!packages/apitoolchain-release-man'
  - '!packages/apitoolchain-filters'
  - '!packages/apitoolchain-sdk-chain'
  - '!packages/apitoolchain-gitprovider-node'
  - '!packages/apitoolchain-registry-api-node'
  - '!packages/apitoolchain-api-node'
  # - 'cli'
  # - '!packages/xyd-mcp-server' # temporary? cuz it's bun
  - '.xyd/host'