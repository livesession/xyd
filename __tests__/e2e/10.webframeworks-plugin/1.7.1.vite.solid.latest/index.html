<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>xyd + Solid</title>
        <style>:root{--brand:#76B3E1}
*{margin:0;box-sizing:border-box}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b0c0f;color:#e8e9ec;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:16px 32px;border-bottom:1px solid #23252b}
header img.xyd{height:18px}
header svg{width:26px;height:26px;fill:var(--brand)}
.plus{color:#565963;font-weight:600;font-size:18px}
header .name{font-weight:600;font-size:17px}
header nav{margin-left:auto}
header nav a{color:#0b0c0f;background:var(--brand);padding:8px 18px;border-radius:8px;text-decoration:none;font-weight:600}
main{display:grid;place-items:center;min-height:calc(100vh - 62px);text-align:center;padding:24px}
.cobrand{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px}
.cobrand img.xyd{height:30px}
.cobrand svg{width:44px;height:44px;fill:var(--brand)}
.cobrand .plus{font-size:26px}
h1{font-size:40px;letter-spacing:-.02em}
p.tag{color:#9a9ca6;margin-top:12px;font-size:17px}
.jsnote{color:#565963;font-size:12px;margin-top:32px}</style>
    </head>
    <body>
        <div id="root" style="display:contents"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
